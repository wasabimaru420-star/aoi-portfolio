<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Aoi Portfolio - About</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding-top: 70px; /* ★ Home と完全一致 */
        background: #0a0a0a;
        color: white;
        font-family: "Noto Sans JP", sans-serif;
        overflow: hidden; /* ★ スクロールなし */
    }

    /* ===== ヘッダー（Home と完全一致） ===== */
    header {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 1000;
        box-sizing: border-box;
    }

    nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        padding: 4px 6px;
        transition: 0.3s;
    }

    nav a:hover {
        color: black;
        background: white;
        border-radius: 4px;
    }

    /* ===== レイアウト ===== */
    .about-layout {
        display: grid;
        grid-template-columns: 40% 60%;
        height: calc(100vh - 70px); /* ★ 画面ぴったり */
    }

    /* ===== 左側：イラスト25を縦ぴったりで配置 ===== */
    .left-img-frame {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        box-sizing: border-box;
        padding-left: 20px;
    }

    .about-img {
        height: 100vh;   /* ★ 画面の上下にぴったり合わせる */
        width: auto;
        object-fit: contain;
        position: fixed; /* ★ 左端に固定 */
        left: 0;
        top: 0;
        border-radius: 0;
    }

    /* ===== 右側テキスト ===== */
   .right-text {
    position: absolute;
    left: 40%;            /* ★ 左画像の幅ぶん右にずらす */
    top: 70px;            /* ★ ヘッダーの下に配置 */
    width: 60%;           /* ★ 右側の領域を確保 */
    height: calc(100vh - 70px);
    padding: 40px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
}

    .about-title {
        font-size: 48px;
        letter-spacing: 4px;
    }

    .about-desc {
        font-size: 20px;
        line-height: 1.8;
        white-space: pre-line;
    }

    .sns-links {
        display: flex;
        gap: 20px;
        margin-top: 10px;
    }

    .sns-links a {
        color: white;
        background: rgba(255,255,255,0.1);
        padding: 10px 20px;
        border-radius: 6px;
        text-decoration: none;
        transition: 0.3s;
    }

    .sns-links a:hover {
        background: white;
        color: black;
    }
</style>
</head>

<body>

<header>
    <div>Aoi Portfolio</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="works.html">Works</a>
        <a href="commission.html">Commission</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main class="about-layout">

    <img src="img/イラスト25.webp" class="about-img">

    <div class="right-text">
        <h1 class="about-title">ABOUT</h1>

        <p class="about-desc">
葵山葵。（あおいわさび。）
キャラクターイラストを中心に活動するイラストレーターです。

キャラクターの魅力や個性を大切にしながら、
Vtuber向けイラスト、キービジュアル、キャラクターデザインなどを制作しています。

個人様、企業様を問わず、イラスト制作のご依頼を受け付けています。
        </p>

        <div class="sns-links">
            <a href="https://twitter.com/" target="_blank">X</a>
            <a href="https://www.instagram.com/" target="_blank">Instagram</a>
            <a href="https://www.pixiv.net/" target="_blank">Pixiv</a>
            <a href="https://github.com/" target="_blank">GitHub</a>
            <a href="https://skeb.jp/" target="_blank">Skeb</a>
        </div>
    </div>

</main>

</body>
</html>
