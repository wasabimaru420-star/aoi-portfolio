<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Aoi Portfolio - About</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background: #0a0a0a;
        color: white;
        font-family: "Noto Sans JP", sans-serif;
        overflow: hidden; /* スクロールなし */
    }

    header {
        position: fixed;
        top: 0;
        width: 100%;
        height: 70px;
        padding: 10px 20px;
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 1000;
    }

    nav {
        display: flex;
        gap: 8px;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        padding: 4px 6px;
        transition: 0.3s;
    }

    nav a:hover {
        color: black;
        background: white;
        border-radius: 4px;
    }

    .blur-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("img/イラスト25.webp");
        background-size: cover;
        background-position: center;
        filter: blur(40px) brightness(0.5);
        z-index: -1;
    }

    .about-layout {
        position: fixed;
        top: 70px; /* ヘッダー分ずらす */
        left: 0;
        width: 100%;
        height: calc(100vh - 70px);
        display: grid;
        grid-template-columns: 38% 62%; /* 左画像・右テキストの比率 */
    }

    .left-img-frame {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        padding-left: 20px;
        box-sizing: border-box;
    }

    .about-img {
        height: 100%; /* ★縦ぴったりで完全に入る */
        width: auto;
        object-fit: contain;
        border-radius: 10px;
    }

    .right-text {
        padding: 40px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
        overflow: hidden; /* はみ出し防止 */
    }

    .about-title {
        font-size: 40px;
        letter-spacing: 4px;
    }

    .about-desc {
        font-size: 18px;
        line-height: 1.8;
        white-space: pre-line;
    }

    .sns-links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 10px;
    }

    .sns-links a {
        color: white;
        background: rgba(255,255,255,0.1);
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 14px;
        transition: 0.3s;
    }

    .sns-links a:hover {
        background: white;
        color: black;
    }
</style>
</head>

<body>

<header>
    <div>Aoi Portfolio</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="works.html">Works</a>
        <a href="commission.html">Commission</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="blur-bg"></div>

<main class="about-layout">

    <div class="left-img-frame">
        <img src="img/イラスト25.webp" class="about-img">
    </div>

    <div class="right-text">
        <h1 class="about-title">ABOUT</h1>

        <p class="about-desc">
葵山葵。（あおいわさび。）
キャラクターイラストを中心に活動するイラストレーターです。

キャラクターの魅力や個性を大切にしながら、
Vtuber向けイラスト、キービジュアル、キャラクターデザインなどを制作しています。

個人様、企業様を問わず、イラスト制作のご依頼を受け付けています。
        </p>

        <div class="sns-links">
            <a href="https://twitter.com/" target="_blank">X</a>
            <a href="https://www.instagram.com/" target="_blank">Instagram</a>
            <a href="https://www.pixiv.net/" target="_blank">Pixiv</a>
            <a href="https://github.com/" target="_blank">GitHub</a>
            <a href="https://skeb.jp/" target="_blank">Skeb</a>
        </div>
    </div>

</main>

</body>
</html>
