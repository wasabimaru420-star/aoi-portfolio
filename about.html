<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Aoi Portfolio - About</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding-top: 70px;
        background: #0a0a0a;
        color: white;
        font-family: "Noto Sans JP", sans-serif;
        overflow: hidden;
    }

    header {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 1000;
        box-sizing: border-box;
    }

    nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        padding: 4px 6px;
        transition: 0.3s;
    }

    nav a:hover {
        color: black;
        background: white;
        border-radius: 4px;
    }

    .about-layout {
        display: grid;
        grid-template-columns: 40% 60%;
        height: calc(100vh - 70px);
    }

    .about-img {
        height: 100vh;
        width: auto;
        object-fit: contain;
        position: fixed;
        left: 0;
        top: 0;
    }

    .right-text {
        position: absolute;
        left: 40%;
        top: 70px;
        width: 60%;
        height: calc(100vh - 70px);
        padding: 40px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 20px;
    }

    .about-title {
        font-size: 48px;
        letter-spacing: 4px;
    }

    .about-desc {
        font-size: 20px;
        line-height: 1.8;
        white-space: pre-line;
    }

    /* ===== 玉 ===== */
    .ball {
        position: fixed;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        z-index: -1;
        transition: 0.3s;
    }

    /* 柔らかい赤・青・黄・緑・紫 */
    .ball:nth-of-type(1) { background: #ff9a9a; }
    .ball:nth-of-type(2) { background: #8ac6ff; }
    .ball:nth-of-type(3) { background: #fff59a; }
    .ball:nth-of-type(4) { background: #9affc6; }
    .ball:nth-of-type(5) { background: #d59aff; }

    /* ===== ボタン化 ===== */
    .ball.to-button {
        z-index: 10;
        background: rgba(255,255,255,0.9);
        width: 120px;
        height: 45px;
        border-radius: 10px;
        color: black;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
    }
</style>
</head>

<body>

<header>
    <div>Aoi Portfolio</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="works.html">Works</a>
        <a href="commission.html">Commission</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main class="about-layout">
    <img src="img/イラスト25.webp" class="about-img">

    <div class="right-text">
        <h1 class="about-title">ABOUT</h1>

        <p class="about-desc">
葵山葵。（あおいわさび。）
キャラクターイラストを中心に活動するイラストレーターです。

キャラクターの魅力や個性を大切にしながら、
Vtuber向けイラスト、キービジュアル、キャラクターデザインなどを制作しています。

個人様、企業様を問わず、イラスト制作のご依頼を受け付けています。
        </p>
    </div>
</main>

<!-- ===== 玉5つ ===== -->
<div class="ball" data-link="https://twitter.com"></div>
<div class="ball" data-link="https://www.instagram.com"></div>
<div class="ball" data-link="https://www.pixiv.net"></div>
<div class="ball" data-link="https://github.com"></div>
<div class="ball" data-link="https://skeb.jp"></div>

<script>
    const balls = document.querySelectorAll(".ball");
    let animationId = null;
    let timeout;

    /* ===== 反射アニメーション設定 ===== */
    const leftLimit = window.innerWidth * 0.40;  // イラスト25の右端
    const rightLimit = window.innerWidth;        // 画面右端
    const topLimit = 0;
    const bottomLimit = window.innerHeight;

    const speeds = [];

    balls.forEach((ball, i) => {
        // 初期位置（右側60%の中でランダム）
        let x = leftLimit + Math.random() * (rightLimit - leftLimit - 110);
        let y = Math.random() * (bottomLimit - 110);

        // ランダム速度（端まで届く強さ）
        let vx = (Math.random() * 6 + 4) * (Math.random() < 0.5 ? -1 : 1);
        let vy = (Math.random() * 6 + 4) * (Math.random() < 0.5 ? -1 : 1);

        speeds.push({ x, y, vx, vy });

        ball.style.left = x + "px";
        ball.style.top = y + "px";
    });

    function animate() {
        balls.forEach((ball, i) => {
            let s = speeds[i];

            s.x += s.vx;
            s.y += s.vy;

            // 左端（イラスト25の右端）
            if (s.x < leftLimit) {
                s.x = leftLimit;
                s.vx *= -1;
            }

            // 右端
            if (s.x > rightLimit - 110) {
                s.x = rightLimit - 110;
                s.vx *= -1;
            }

            // 上端
            if (s.y < topLimit) {
                s.y = topLimit;
                s.vy *= -1;
            }

            // 下端
            if (s.y > bottomLimit - 110) {
                s.y = bottomLimit - 110;
                s.vy *= -1;
            }

            ball.style.left = s.x + "px";
            ball.style.top = s.y + "px";
        });

        animationId = requestAnimationFrame(animate);
    }

    animate();

    /* ===== ボタン化位置 ===== */
    const positions = [
        { left: "45vw", top: "75vh", label: "X" },
        { left: "55vw", top: "75vh", label: "Instagram" },
        { left: "65vw", top: "75vh", label: "Pixiv" },
        { left: "75vw", top: "75vh", label: "GitHub" },
        { left: "85vw", top: "75vh", label: "Skeb" }
    ];

    /* ===== クリックでボタン化 ===== */
    document.addEventListener("click", (e) => {
        if (e.target.closest("header") || e.target.closest(".about-img")) return;

        cancelAnimationFrame(animationId); // ★動きを完全停止

        balls.forEach((ball, i) => {
            ball.classList.add("to-button");
            ball.style.left = positions[i].left;
            ball.style.top = positions[i].top;
            ball.textContent = positions[i].label;

            ball.onclick = () => {
                window.open(ball.dataset.link, "_blank");
            };
        });

        clearTimeout(timeout);
        timeout = setTimeout(() => {
            balls.forEach(ball => {
                ball.classList.remove("to-button");
                ball.textContent = "";
            });

            animate(); // ★反射アニメーション再開
        }, 5000);
    });
</script>

</body>
</html>
