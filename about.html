<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Aoi Portfolio - About</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding-top: 70px;
        background: #0a0a0a;
        color: white;
        font-family: "Noto Sans JP", sans-serif;
        overflow: hidden;
    }

    header {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 1000;
        box-sizing: border-box;
    }

    nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        padding: 4px 6px;
        transition: 0.3s;
    }

    nav a:hover {
        color: black;
        background: white;
        border-radius: 4px;
    }

    .about-layout {
        display: grid;
        grid-template-columns: 40% 60%;
        height: calc(100vh - 70px);
    }

    .about-img {
        height: 100vh;
        width: auto;
        object-fit: contain;
        position: fixed;
        left: 0;
        top: 0;
        border-radius: 0;
    }

    .right-text {
        position: absolute;
        left: 40%;
        top: 70px;
        width: 60%;
        height: calc(100vh - 70px);
        padding: 40px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
    }

    .about-title {
        font-size: 48px;
        letter-spacing: 4px;
    }

    .about-desc {
        font-size: 20px;
        line-height: 1.8;
        white-space: pre-line;
    }

    .sns-links {
        display: flex;
        gap: 20px;
        margin-top: 10px;
    }

    .sns-links a {
        color: white;
        background: rgba(255,255,255,0.1);
        padding: 10px 20px;
        border-radius: 6px;
        text-decoration: none;
        transition: 0.3s;
    }

    .sns-links a:hover {
        background: white;
        color: black;
    }

    /* ===== 背景で跳ね回る玉 ===== */
    .ball {
        position: fixed;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(255,255,255,0.25);
        z-index: -1;
        animation: bounce 6s infinite ease-in-out;
        transition: 0.5s ease;
    }

    @keyframes bounce {
        0%   { transform: translate(0, 0); }
        25%  { transform: translate(20vw, 30vh); }
        50%  { transform: translate(40vw, -10vh); }
        75%  { transform: translate(10vw, 40vh); }
        100% { transform: translate(0, 0); }
    }

    /* ボタン化 */
    .ball.to-button {
        animation: none;
        z-index: 10;
        background: rgba(255,255,255,0.9);
        width: 160px;
        height: 50px;
        border-radius: 8px;
        color: black;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
    }
</style>
</head>

<body>

<header>
    <div>Aoi Portfolio</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="works.html">Works</a>
        <a href="commission.html">Commission</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main class="about-layout">

    <img src="img/イラスト25.webp" class="about-img">

    <div class="right-text">
        <h1 class="about-title">ABOUT</h1>

        <p class="about-desc">
葵山葵。（あおいわさび。）
キャラクターイラストを中心に活動するイラストレーターです。

キャラクターの魅力や個性を大切にしながら、
Vtuber向けイラスト、キービジュアル、キャラクターデザインなどを制作しています。

個人様、企業様を問わず、イラスト制作のご依頼を受け付けています。
        </p>

        <div class="sns-links">
            <a href="https://twitter.com/" target="_blank">X</a>
            <a href="https://www.instagram.com/" target="_blank">Instagram</a>
            <a href="https://www.pixiv.net/" target="_blank">Pixiv</a>
            <a href="https://github.com/" target="_blank">GitHub</a>
            <a href="https://skeb.jp/" target="_blank">Skeb</a>
        </div>
    </div>

</main>

<!-- ===== 玉5つ（SNSボタンの化身） ===== -->
<div class="ball" data-link="https://twitter.com" style="left:10vw; top:20vh;">X</div>
<div class="ball" data-link="https://www.instagram.com" style="left:30vw; top:50vh;">Instagram</div>
<div class="ball" data-link="https://www.pixiv.net" style="left:50vw; top:10vh;">Pixiv</div>
<div class="ball" data-link="https://github.com" style="left:70vw; top:40vh;">GitHub</div>
<div class="ball" data-link="https://skeb.jp" style="left:20vw; top:70vh;">Skeb</div>

<script>
    const balls = document.querySelectorAll(".ball");
    let timeout;

    const positions = [
        { left: "45vw", top: "30vh" },
        { left: "45vw", top: "40vh" },
        { left: "45vw", top: "50vh" },
        { left: "45vw", top: "60vh" },
        { left: "45vw", top: "70vh" }
    ];

    document.addEventListener("click", (e) => {
        if (e.target.closest("header") || e.target.closest(".about-img")) return;

        balls.forEach((ball, i) => {
            ball.classList.add("to-button");
            ball.style.left = positions[i].left;
            ball.style.top = positions[i].top;

            ball.onclick = () => {
                window.open(ball.dataset.link, "_blank");
            };
        });

        clearTimeout(timeout);
        timeout = setTimeout(() => {
            balls.forEach(ball => {
                ball.classList.remove("to-button");
            });
        }, 5000);
    });
</script>

</body>
</html>
