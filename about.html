<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Aoi Portfolio - About</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding-top: 70px;
        background: #0a0a0a;
        color: white;
        font-family: "Noto Sans JP", sans-serif;
        overflow: hidden;
    }

    header {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 1000;
        box-sizing: border-box;
    }

    nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        padding: 4px 6px;
        transition: 0.3s;
    }

    nav a:hover {
        color: black;
        background: white;
        border-radius: 4px;
    }

    .about-layout {
        display: grid;
        grid-template-columns: 40% 60%;
        height: calc(100vh - 70px);
    }

    .about-img {
        height: 100vh;
        width: auto;
        object-fit: contain;
        position: fixed;
        left: 0;
        top: 0;
    }

    .right-text {
        position: absolute;
        left: 40%;
        top: 70px;
        width: 60%;
        height: calc(100vh - 70px);
        padding: 40px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 20px;
    }

    .about-title {
        font-size: 48px;
        letter-spacing: 4px;
    }

    .about-desc {
        font-size: 20px;
        line-height: 1.8;
        white-space: pre-line;
    }

    /* ===== 玉 ===== */
    .ball {
        position: fixed;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        z-index: -1;
        transition: transform 0.12s ease;
    }

    .ball:nth-of-type(1) { background: #ff9a9a; }
    .ball:nth-of-type(2) { background: #8ac6ff; }
    .ball:nth-of-type(3) { background: #fff59a; }
    .ball:nth-of-type(4) { background: #9affc6; }
    .ball:nth-of-type(5) { background: #d59aff; }

    .ball.squash-x { transform: scaleX(0.8); }
    .ball.squash-y { transform: scaleY(0.8); }

    /* ===== ボタン化 ===== */
    .ball.to-button {
        z-index: 10;
        width: 120px;
        height: 45px;
        border-radius: 10px;
        color: black;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 1s ease;
        transform: none !important;
    }

    .ball.to-button:hover {
        transform: scale(1.08);
        box-shadow: 0 0 20px rgba(255,255,255,0.6);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .ball.pop {
        transform: scale(1.3);
    }

    /* ===== ボタン → 玉に戻る演出 ===== */
    .ball.unpop {
        transform: scale(0.7);
        opacity: 0.5;
        transition: transform 0.45s ease, opacity 0.45s ease;
    }

    /* ===== ランダム点滅（案内演出） ===== */
    @keyframes hintGlow {
        0% { box-shadow: 0 0 0 rgba(255,255,255,0); }
        50% { box-shadow: 0 0 25px rgba(255,255,255,0.55); }
        100% { box-shadow: 0 0 0 rgba(255,255,255,0); }
    }

    .ball.hint-glow {
        animation: hintGlow 3s ease-in-out infinite;
    }

</style>
</head>

<body>

<header>
    <div>Aoi Portfolio</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="works.html">Works</a>
        <a href="commission.html">Commission</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main class="about-layout">
    <img src="img/イラスト25.webp" class="about-img">

    <div class="right-text">
        <h1 class="about-title">ABOUT</h1>

        <p class="about-desc">
葵山葵。（あおいわさび。）
キャラクターイラストを中心に活動するイラストレーターです。

キャラクターの魅力や個性を大切にしながら、
Vtuber向けイラスト、キービジュアル、キャラクターデザインなどを制作しています。

個人様、企業様を問わず、イラスト制作のご依頼を受け付けています。

ご依頼に関してはcommissionのページをご覧ください。
ご連絡に関してはcontactのページですが、光る玉に触れて見ると何か分かるかもしれません。
        </p>
    </div>
</main>

<!-- ===== 玉5つ ===== -->
<div class="ball" data-link="https://twitter.com"></div>
<div class="ball" data-link="https://www.instagram.com"></div>
<div class="ball" data-link="https://www.pixiv.net"></div>
<div class="ball" data-link="https://github.com"></div>
<div class="ball" data-link="https://skeb.jp"></div>

<script>
    const balls = document.querySelectorAll(".ball");
    let animationId = null;
    let timeout;

    const leftLimit = window.innerWidth * 0.40;
    const rightLimit = window.innerWidth;
    const topLimit = 0;
    const bottomLimit = window.innerHeight;

    const speeds = [];

    /* ===== ランダム点滅（案内） ===== */
    function setRandomHintGlow() {
        balls.forEach(ball => ball.classList.remove("hint-glow"));
        const randomIndex = Math.floor(Math.random() * balls.length);
        balls[randomIndex].classList.add("hint-glow");
    }

    /* 初期案内 */
    setRandomHintGlow();

    /* ===== 平常時の反射アニメーション ===== */
    balls.forEach((ball, i) => {
        let x = leftLimit + Math.random() * (rightLimit - leftLimit - 110);
        let y = Math.random() * (bottomLimit - 110);

        let vx = (Math.random() * 3 + 2) * (Math.random() < 0.5 ? -1 : 1);
        let vy = (Math.random() * 3 + 2) * (Math.random() < 0.5 ? -1 : 1);

        speeds.push({ x, y, vx, vy });

        ball.style.left = x + "px";
        ball.style.top = y + "px";
    });

    function animate() {
        balls.forEach((ball, i) => {
            let s = speeds[i];

            s.x += s.vx;
            s.y += s.vy;

            if (s.x < leftLimit) {
                s.x = leftLimit;
                s.vx *= -1;
                ball.classList.add("squash-x");
                setTimeout(() => ball.classList.remove("squash-x"), 120);
            }

            if (s.x > rightLimit - 110) {
                s.x = rightLimit - 110;
                s.vx *= -1;
                ball.classList.add("squash-x");
                setTimeout(() => ball.classList.remove("squash-x"), 120);
            }

            if (s.y < topLimit) {
                s.y = topLimit;
                s.vy *= -1;
                ball.classList.add("squash-y");
                setTimeout(() => ball.classList.remove("squash-y"), 120);
            }

            if (s.y > bottomLimit - 110) {
                s.y = bottomLimit - 110;
                s.vy *= -1;
                ball.classList.add("squash-y");
                setTimeout(() => ball.classList.remove("squash-y"), 120);
            }

            ball.style.left = s.x + "px";
            ball.style.top = s.y + "px";
        });

        animationId = requestAnimationFrame(animate);
    }

    animate();

    /* ===== ボタン化位置 ===== */
    const positions = [
        { left: "45vw", top: "75vh", label: "X" },
        { left: "55vw", top: "75vh", label: "Instagram" },
        { left: "65vw", top: "75vh", label: "Pixiv" },
        { left: "75vw", top: "75vh", label: "GitHub" },
        { left: "85vw", top: "75vh", label: "Skeb" }
    ];

    /* ===== クリックでボタン化 ===== */
    document.addEventListener("click", (e) => {
        if (e.target.closest("header") || e.target.closest(".about-img")) return;

        cancelAnimationFrame(animationId);

        /* ボタン化中は案内消す */
        balls.forEach(ball => ball.classList.remove("hint-glow"));

        balls.forEach((ball, i) => {
            ball.classList.add("pop");

            setTimeout(() => {
                ball.classList.remove("pop");
                ball.classList.add("to-button");

                const color = window.getComputedStyle(ball).backgroundColor;
                ball.style.backgroundColor = color;

                ball.style.left = positions[i].left;
                ball.style.top = positions[i].top;
                ball.textContent = positions[i].label;

                ball.onclick = () => {
                    window.open(ball.dataset.link, "_blank");
                };
            }, 150);
        });

        clearTimeout(timeout);
        timeout = setTimeout(() => {
            balls.forEach(ball => {
                ball.classList.add("unpop");

                setTimeout(() => {
                    ball.classList.remove("to-button");
                    ball.classList.remove("unpop");
                    ball.textContent = "";
                }, 450);
            });

            /* 玉に戻ったら案内復活（ランダム） */
            setRandomHintGlow();

            animate();
        }, 5000);
    });
</script>

</body>
</html>
