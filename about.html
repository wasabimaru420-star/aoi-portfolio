<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Aoi Portfolio - About</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding-top: 70px;
        background: #0a0a0a;
        color: white;
        font-family: "Noto Sans JP", sans-serif;
        overflow: hidden;
    }

    header {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 1000;
        box-sizing: border-box;
    }

    nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        padding: 4px 6px;
        transition: 0.3s;
    }

    nav a:hover {
        color: black;
        background: white;
        border-radius: 4px;
    }

    .about-layout {
        display: grid;
        grid-template-columns: 40% 60%;
        height: calc(100vh - 70px);
    }

    .about-img {
        height: 100vh;
        width: auto;
        object-fit: contain;
        position: fixed;
        left: 0;
        top: 0;
        border-radius: 0;
    }

    .right-text {
        position: absolute;
        left: 40%;
        top: 70px;
        width: 60%;
        height: calc(100vh - 70px);
        padding: 40px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 20px;
    }

    .about-title {
        font-size: 48px;
        letter-spacing: 4px;
    }

    .about-desc {
        font-size: 20px;
        line-height: 1.8;
        white-space: pre-line;
    }

    /* ===== 玉（SNSボタンの化身） ===== */
    .ball {
        position: fixed;
        width: 110px; /* ★大きさはそのまま */
        height: 110px;
        border-radius: 50%;
        z-index: -1;
        transition: 0.6s ease;
    }

    /* 柔らかい赤・青・黄・緑・紫 */
    .ball:nth-child(1) { background: #ff9a9a; animation: move1 6s infinite ease-in-out; }
    .ball:nth-child(2) { background: #8ac6ff; animation: move2 7s infinite ease-in-out; }
    .ball:nth-child(3) { background: #fff59a; animation: move3 5.5s infinite ease-in-out; }
    .ball:nth-child(4) { background: #9affc6; animation: move4 6.5s infinite ease-in-out; }
    .ball:nth-child(5) { background: #d59aff; animation: move5 7.5s infinite ease-in-out; }

    /* ===== 玉の動き範囲を右側60%に限定 ===== */
    @keyframes move1 {
        0% { transform: translate(0,0); }
        25% { transform: translate(10vw, 10vh); }
        50% { transform: translate(20vw, 25vh); }
        75% { transform: translate(15vw, -20vh); }
        100% { transform: translate(0,0); }
    }

    @keyframes move2 {
        0% { transform: translate(0,0); }
        30% { transform: translate(15vw, 30vh); }
        60% { transform: translate(25vw, -15vh); }
        100% { transform: translate(0,0); }
    }

    @keyframes move3 {
        0% { transform: translate(0,0); }
        20% { transform: translate(10vw, -10vh); }
        50% { transform: translate(20vw, 20vh); }
        80% { transform: translate(15vw, 30vh); }
        100% { transform: translate(0,0); }
    }

    @keyframes move4 {
        0% { transform: translate(0,0); }
        25% { transform: translate(25vw, 15vh); }
        55% { transform: translate(20vw, 25vh); }
        85% { transform: translate(10vw, -20vh); }
        100% { transform: translate(0,0); }
    }

    @keyframes move5 {
        0% { transform: translate(0,0); }
        35% { transform: translate(30vw, 20vh); }
        65% { transform: translate(15vw, -25vh); }
        100% { transform: translate(0,0); }
    }

    /* ===== ボタン化（今のまま） ===== */
    .ball.to-button {
        animation: none;
        z-index: 10;
        background: rgba(255,255,255,0.9);
        width: 120px;
        height: 45px;
        border-radius: 10px;
        color: black;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
    }
</style>
</head>

<body>

<header>
    <div>Aoi Portfolio</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="works.html">Works</a>
        <a href="commission.html">Commission</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main class="about-layout">

    <img src="img/イラスト25.webp" class="about-img">

    <div class="right-text">
        <h1 class="about-title">ABOUT</h1>

        <p class="about-desc">
葵山葵。（あおいわさび。）
キャラクターイラストを中心に活動するイラストレーターです。

キャラクターの魅力や個性を大切にしながら、
Vtuber向けイラスト、キービジュアル、キャラクターデザインなどを制作しています。

個人様、企業様を問わず、イラスト制作のご依頼を受け付けています。
        </p>
    </div>

</main>

<!-- ===== 玉5つ（右側60%に配置し直し） ===== -->
<div class="ball" data-link="https://twitter.com" style="left:45vw; top:20vh;"></div>
<div class="ball" data-link="https://www.instagram.com" style="left:55vw; top:50vh;"></div>
<div class="ball" data-link="https://www.pixiv.net" style="left:65vw; top:10vh;"></div>
<div class="ball" data-link="https://github.com" style="left:75vw; top:40vh;"></div>
<div class="ball" data-link="https://skeb.jp" style="left:85vw; top:70vh;"></div>

<script>
    const balls = document.querySelectorAll(".ball");
    let timeout;

    /* ★ ABOUT・説明文の下に横並びだった元のSNSボタン位置 */
    const positions = [
        { left: "45vw", top: "75vh", label: "X" },
        { left: "55vw", top: "75vh", label: "Instagram" },
        { left: "65vw", top: "75vh", label: "Pixiv" },
        { left: "75vw", top: "75vh", label: "GitHub" },
        { left: "85vw", top: "75vh", label: "Skeb" }
    ];

    document.addEventListener("click", (e) => {
        if (e.target.closest("header") || e.target.closest(".about-img")) return;

        balls.forEach((ball, i) => {
            ball.classList.add("to-button");
            ball.style.left = positions[i].left;
            ball.style.top = positions[i].top;
            ball.textContent = positions[i].label;

            ball.onclick = () => {
                window.open(ball.dataset.link, "_blank");
            };
        });

        clearTimeout(timeout);
        timeout = setTimeout(() => {
            balls.forEach(ball => {
                ball.classList.remove("to-button");
                ball.textContent = "";
            });
        }, 5000);
    });
</script>

</body>
</html>
