<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Aoi Portfolio - Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding-top: 70px;

        background: #0a0a0a url('img/イラスト25.webp');
        background-position: top center;
        background-attachment: scroll;
        background-size: 100% auto;
        background-repeat: no-repeat;

        color: white;
        font-family: "Noto Sans JP", sans-serif;
        overflow-x: hidden;
    }

    header {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 1000;
    }

    nav {
        display: flex;
        gap: 10px;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 18px;
        padding: 4px 8px;
        transition: 0.3s;
    }

    nav a:hover {
        color: black;
        background: white;
        border-radius: 4px;
    }

    .hero {
        height: 40vh;
    }

    /* ★ セクション全体を900px下げる（スライドイン維持） */
    section {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 900px 80px 60px; /* ← 下端を縮めた */
        box-sizing: border-box;
        position: relative;
    }

    /* ★ 白帯（画面比率で高さ変化） */
    .image-backdrop {
        position: absolute;
        right: 0;
        top: 180px;
        width: 55%;
        height: 45vh; /* ← 面積固定のため比率で変化 */
        background: white;
        border-radius: 20px;
        z-index: -1;
    }

    /* ★ 黄色帯（文字を中に入れる） */
    .big-title-box {
        position: absolute;
        left: 0;
        top: 220px;
        width: 70%;
        height: 180px;
        background: linear-gradient(90deg, #ffe27a, #f5d76e, #eac55f);
        border-radius: 10px;
        z-index: 1;
    }

    /* ★ セクション番号（黄色帯の中に入れる） */
    .section-number {
        position: absolute;
        left: 20px;
        top: 240px; /* 黄色帯の中 */
        font-size: 60px;
        font-weight: 800;
        color: #444;
        opacity: 0;
        transform: translateY(40px);
        transition: 1s ease;
        z-index: 2;
    }

    /* ★ タイトル（黄色帯の中に入れる） */
    .big-title {
        position: absolute;
        left: 20px;
        top: 300px; /* 黄色帯の中 */
        font-size: 120px;
        font-weight: 900;
        color: #444;
        opacity: 0;
        transform: translateY(40px);
        transition: 1s ease;
        line-height: 0.9;
        letter-spacing: -2px;
        z-index: 2;
    }

    /* ★ 説明文（黄色帯の下端に揃える） */
    .text {
        position: absolute;
        left: 20px;
        top: 360px; /* 黄色帯の下端に揃える */
        width: 60%;
        font-size: 20px;
        color: #444;
        opacity: 0;
        transform: translateY(20px);
        transition: 1s ease;
        z-index: 2;
    }

    .show-title {
        opacity: 1;
        transform: translateY(0);
    }
    .show-text {
        opacity: 1;
        transform: translateY(0);
    }

    /* ★ 画像（画面比率で高さ変化・頭飛び出し・白帯下端と一致） */
    .crop-img {
        position: absolute;
        right: 80px;

        width: 55%;
        height: 60vh; /* ← 面積固定のため比率で変化 */

        /* 数学的に白帯の下端と一致させる */
        top: calc(180px - 15vh); /* 180px + 45vh - 60vh = 180px - 15vh */

        object-fit: cover;
        object-position: top;
        border-radius: 10px;

        opacity: 0;
        transform: translateX(50px);
        transition: 1s ease;
        z-index: 2;
    }

    /* ★ 通常画像（WORKSなど） */
    .normal-img {
        position: absolute;
        right: 80px;
        top: calc(180px - 15vh);

        width: 55%;
        height: 60vh;

        object-fit: cover;
        object-position: center;
        border-radius: 10px;

        opacity: 0;
        transform: translateX(50px);
        transition: 1s ease;
        z-index: 2;
    }

    .show-img {
        opacity: 1;
        transform: translateX(0);
    }

    .more-btn {
        display: inline-block;
        margin-top: 10px;
        padding: 10px 20px;
        border: 2px solid white;
        color: white;
        text-decoration: none;
        transition: 0.3s;
    }

    .more-btn:hover {
        background: white;
        color: black;
    }
</style>
</head>

<body>

<header>
    <div>Aoi Portfolio</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="works.html">Works</a>
        <a href="commission.html">Commission</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="hero"></div>

<!-- 02 ABOUT -->
<section id="about">
    <div class="image-backdrop"></div>
    <div class="big-title-box"></div>

    <div class="section-number">02</div>
    <div class="big-title">ABOUT</div>
    <div class="text">
        あなたのプロフィールや制作スタイルを紹介するセクション
        <br><a class="more-btn" href="about.html">もっと見る</a>
    </div>

    <img class="crop-img" src="img/イラスト196.webp" alt="">
</section>

<!-- 03 WORKS -->
<section id="works">
    <div class="image-backdrop"></div>
    <div class="big-title-box"></div>

    <div class="section-number">03</div>
    <div class="big-title">WORKS</div>
    <div class="text">
        イラスト作品一覧を紹介するセクション
        <br><a class="more-btn" href="works.html">もっと見る</a>
    </div>

    <img class="normal-img" src="img/イラスト14.webp" alt="">
</section>

<!-- 04 COMMISSION -->
<section id="commission">
    <div class="image-backdrop"></div>
    <div class="big-title-box"></div>

    <div class="section-number">04</div>
    <div class="big-title">COMMISSION</div>
    <div class="text">
        依頼料金や制作の流れを紹介するセクション
        <br><a class="more-btn" href="commission.html">もっと見る</a>
    </div>

    <img class="normal-img" src="" alt="">
</section>

<!-- 05 CONTACT -->
<section id="contact">
    <div class="image-backdrop"></div>
    <div class="big-title-box"></div>

    <div class="section-number">05</div>
    <div class="big-title">CONTACT</div>
    <div class="text">
        依頼フォームや連絡先を紹介するセクション
        <br><a class="more-btn" href="contact.html">もっと見る</a>
    </div>

    <img class="normal-img" src="" alt="">
</section>

<script>
    const sections = document.querySelectorAll("section");

    window.addEventListener("scroll", () => {
        sections.forEach(sec => {
            const rect = sec.getBoundingClientRect();

            if (rect.top < window.innerHeight && rect.bottom > 0) {
                sec.querySelector(".section-number").classList.add("show-title");
                sec.querySelector(".big-title").classList.add("show-title");
                sec.querySelector(".text").classList.add("show-text");
                sec.querySelector("img").classList.add("show-img");
            }

            if (rect.bottom < 0 || rect.top > window.innerHeight) {
                sec.querySelector(".section-number").classList.remove("show-title");
                sec.querySelector(".big-title").classList.remove("show-title");
                sec.querySelector(".text").classList.remove("show-text");
                sec.querySelector("img").classList.remove("show-img");
            }
        });
    });
</script>

</body>
</html>
