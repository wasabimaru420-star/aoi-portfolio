<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Aoi Portfolio - Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding-top: 70px;
        background: #0a0a0a;
        color: white;
        font-family: "Noto Sans JP", sans-serif;
        overflow-x: hidden;
    }

    /* 固定ヘッダー */
    header {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 1000;
        box-sizing: border-box;
    }

    nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    nav a {
        color: white;
        margin-left: 0;
        text-decoration: none;
        font-size: 18px;
        padding: 4px 8px;
        transition: 0.3s;
    }

    nav a:hover {
        color: #000;
        background: #fff;
        border-radius: 4px;
    }

    /* HERO（kv2 の画像を上にくっつけてサイズダウン） */
    .hero {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start; /* ← 上にくっつける */
        padding-top: 40px;
    }
    .hero img {
        width: 60%;
        border-radius: 20px;
    }

    /* セクション共通 */
    section {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 120px 80px;
        box-sizing: border-box;
        position: relative;
    }

    /* 画像の後ろの白い太い帯（透かし無し） */
    .image-backdrop {
        position: absolute;
        right: 0;
        top: 120px;
        width: 55%;
        height: 60%; /* ← ABOUT の縦幅を揃えるために調整 */
        background: #ffffff;
        border-radius: 20px;
        z-index: -1;
    }

    /* セクション番号（濃いグレー） */
    .section-number {
        font-size: 48px;
        font-weight: 800;
        color: #444444;
        opacity: 0;
        transform: translateY(40px);
        transition: 1s ease;
        margin-bottom: 10px;
        position: relative;
        z-index: 2;
    }

    /* タイトルの後ろの黄色帯（文字に重なるように修正） */
    .big-title-box {
        position: absolute;
        left: 0;
        top: 20px; /* ← 文字に重なるように上へ詰める */
        width: 70%;
        height: 180px; /* ← 文字にフィットする高さ */
        background: linear-gradient(90deg, #ffe27a 0%, #f5d76e 50%, #eac55f 100%);
        opacity: 1;
        border-radius: 10px;
        z-index: 1;
    }

    /* 巨大タイトル（濃いグレー） */
    .big-title {
        font-size: 120px;
        font-weight: 900;
        color: #444444;
        opacity: 0;
        transform: translateY(40px);
        transition: 1s ease;
        line-height: 0.9;
        letter-spacing: -2px;
        margin-bottom: 40px;
        position: relative;
        z-index: 2;
    }

    .show-title {
        opacity: 1;
        transform: translateY(0);
    }

    /* 説明文（濃いグレー） */
    section .text {
        width: 45%;
        font-size: 20px;
        color: #444444;
        opacity: 0;
        transform: translateX(-50px);
        transition: 1s ease;
        position: relative;
        z-index: 2;
    }

    /* 下だけトリミングする画像（ABOUT用） */
    .crop-img {
        width: 45%;
        height: 450px;      /* ← 帯に合わせた高さ */
        object-fit: cover;  /* ← トリミング有効化 */
        object-position: top; /* ← 上はそのまま、下だけ切れる */
        border-radius: 10px;
        opacity: 0;
        transform: translateX(50px);
        transition: 1s ease;
        position: relative;
        z-index: 2;
    }

    section img:not(.crop-img) {
        width: 45%;
        border-radius: 10px;
        opacity: 0;
        transform: translateX(50px);
        transition: 1s ease;
        position: relative;
        z-index: 2;
    }

    .show-img {
        opacity: 1;
        transform: translateX(0);
    }
    .show-text {
        opacity: 1;
        transform: translateX(0);
    }

    .more-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        border: 2px solid white;
        color: white;
        text-decoration: none;
        transition: 0.3s;
    }
    .more-btn:hover {
        background: white;
        color: black;
    }
</style>
</head>

<body>

<header>
    <div>Aoi Portfolio</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="works.html">Works</a>
        <a href="commission.html">Commission</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="hero">
    <img src="img/kv2.webp" alt="">
</div>

<!-- 02 ABOUT -->
<section id="about">
    <div class="image-backdrop"></div>
    <div class="left">
        <div class="section-number">02</div>
        <div class="big-title-box"></div>
        <div class="big-title">ABOUT</div>
        <div class="text">
            あなたのプロフィールや制作スタイルを紹介するセクション
            <br><a class="more-btn" href="about.html">もっと見る</a>
        </div>
    </div>

    <!-- 下だけトリミングする画像 -->
    <img class="crop-img" src="img/イラスト196.webp" alt="">
</section>

<!-- 03 WORKS -->
<section id="works">
    <div class="image-backdrop"></div>
    <div class="left">
        <div class="section-number">03</div>
        <div class="big-title-box"></div>
        <div class="big-title">WORKS</div>
        <div class="text">
            イラスト作品一覧を紹介するセクション
            <br><a class="more-btn" href="works.html">もっと見る</a>
        </div>
    </div>
    <img src="img/イラスト14.webp" alt="">
</section>

<!-- 04 COMMISSION -->
<section id="commission">
    <div class="image-backdrop"></div>
    <div class="left">
        <div class="section-number">04</div>
        <div class="big-title-box"></div>
        <div class="big-title">COMMISSION</div>
        <div class="text">
            依頼料金や制作の流れを紹介するセクション
            <br><a class="more-btn" href="commission.html">もっと見る</a>
        </div>
    </div>
    <img src="" alt="">
</section>

<!-- 05 CONTACT -->
<section id="contact">
    <div class="image-backdrop"></div>
    <div class="left">
        <div class="section-number">05</div>
        <div class="big-title-box"></div>
        <div class="big-title">CONTACT</div>
        <div class="text">
            依頼フォームや連絡先を紹介するセクション
            <br><a class="more-btn" href="contact.html">もっと見る</a>
        </div>
    </div>
    <img src="" alt="">
</section>

<script>
    const sections = document.querySelectorAll("section");

    window.addEventListener("scroll", () => {
        sections.forEach(sec => {
            const rect = sec.getBoundingClientRect();

            if (rect.top < window.innerHeight && rect.bottom > 0) {
                sec.querySelector(".section-number").classList.add("show-title");
                sec.querySelector(".big-title").classList.add("show-title");
                sec.querySelector(".text").classList.add("show-text");
                sec.querySelector("img").classList.add("show-img");
            }

            if (rect.bottom < 0 || rect.top > window.innerHeight) {
                sec.querySelector(".section-number").classList.remove("show-title");
                sec.querySelector(".big-title").classList.remove("show-title");
                sec.querySelector(".text").classList.remove("show-text");
                sec.querySelector("img").classList.remove("show-img");
            }
        });
    });
</script>

</body>
</html>
