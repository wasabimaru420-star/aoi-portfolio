<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Aoi Portfolio - Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding-top: 70px;

        background: #0a0a0a url('img/イラスト25.webp');
        background-position: top center;
        background-attachment: scroll;
        background-size: 100% auto;
        background-repeat: no-repeat;

        color: white;
        font-family: "Noto Sans JP", sans-serif;
        overflow-x: hidden;
    }

    header {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 1000;
        box-sizing: border-box;
    }

    nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        padding: 4px 6px;
        transition: 0.3s;
    }

    nav a:hover {
        color: black;
        background: white;
        border-radius: 4px;
    }

    .hero {
        height: 40vh;
    }

    section {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 900px 80px 60px;
        box-sizing: border-box;
        position: relative;
    }

    .image-backdrop {
        position: absolute;
        right: 0;
        top: 180px;
        width: 55%;
        height: 45vh;
        background: white;
        border-radius: 20px;
        z-index: -1;
    }

    .big-title-box {
        position: absolute;
        left: 0;
        top: 220px;
        width: 70%;
        height: 180px;
        background: linear-gradient(90deg, #ffe27a, #f5d76e, #eac55f);
        border-radius: 10px;
        z-index: 1;
    }

    .section-number {
        position: absolute;
        left: 20px;
        top: 240px;
        font-size: 60px;
        font-weight: 800;
        color: #444;
        opacity: 0;
        transform: translateY(40px);
        transition: 1s ease;
        z-index: 2;
    }

    .big-title {
        position: absolute;
        left: 20px;
        top: 292px;
        font-size: 120px;
        font-weight: 900;
        color: #444;
        opacity: 0;
        transform: translateY(40px);
        transition: 1s ease;
        line-height: 0.9;
        letter-spacing: -2px;
        z-index: 2;
    }

    /* 説明文 → 白帯の中へ移動 */
    .text {
        position: absolute;
        right: 100px;
        top: 220px;
        width: 40%;
        font-size: 20px;
        color: #444;

        opacity: 0;
        transform: translateY(20px);
        transition: 1s ease;
        z-index: 3;
    }

    .show-title {
        opacity: 1;
        transform: translateY(0);
    }
    .show-text {
        opacity: 1;
        transform: translateY(0);
    }

    /* 膝から上だけ表示する枠 */
    .image-frame {
        position: absolute;
        right: 80px;
        top: 180px;

        width: 55%;
        height: 60vh; /* ← 膝位置に合わせて調整可能 */
        overflow: hidden; /* ← 膝から下を隠す */

        border-radius: 10px;
        z-index: 2;
    }

    /* 中の画像は比率維持のまま上側を表示 */
    .crop-img {
        width: 100%;
        height: auto;
        object-fit: cover;
        object-position: top;

        opacity: 0;
        transform: translateX(50px);
        transition: 1s ease;
    }

    /* WORKS の画像（白帯内に収める） */
    .normal-img {
        position: absolute;
        right: 80px;
        top: 180px;

        width: 55%;
        height: auto;
        max-height: 45vh;
        object-fit: contain;

        border-radius: 10px;
        opacity: 0;
        transform: translateX(50px);
        transition: 1s ease;
        z-index: 2;
    }

    .show-img {
        opacity: 1;
        transform: translateX(0);
    }

    /* もっと見る → 白帯右下へ移動、黒背景で視認性UP */
    .more-btn {
        position: absolute;
        right: 40px;
        bottom: 40px;

        background: black;
        color: white;
        padding: 10px 20px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;

        z-index: 4;
    }

</style>
</head>

<body>

<header>
    <div>Aoi Portfolio</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="works.html">Works</a>
        <a href="commission.html">Commission</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="hero"></div>

<!-- 02 ABOUT -->
<section id="about">
    <div class="image-backdrop"></div>
    <div class="big-title-box"></div>

    <div class="section-number">02</div>
    <div class="big-title">ABOUT</div>

    <div class="text">
        あなたのプロフィールや制作スタイルを紹介するセクション
    </div>

    <div class="image-frame">
        <img class="crop-img" src="img/イラスト196.webp" alt="">
    </div>

    <a class="more-btn" href="about.html">もっと見る</a>
</section>

<!-- 03 WORKS -->
<section id="works">
    <div class="image-backdrop"></div>
    <div class="big-title-box"></div>

    <div class="section-number">03</div>
    <div class="big-title">WORKS</div>

    <div class="text">
        イラスト作品一覧を紹介するセクション
    </div>

    <img class="normal-img" src="img/イラスト14.webp" alt="">

    <a class="more-btn" href="works.html">もっと見る</a>
</section>

<!-- 04 COMMISSION -->
<section id="commission">
    <div class="image-backdrop"></div>
    <div class="big-title-box"></div>

    <div class="section-number">04</div>
    <div class="big-title">COMMISSION</div>

    <div class="text">
        依頼料金や制作の流れを紹介するセクション
    </div>

    <a class="more-btn" href="commission.html">もっと見る</a>
</section>

<!-- 05 CONTACT -->
<section id="contact">
    <div class="image-backdrop"></div>
    <div class="big-title-box"></div>

    <div class="section-number">05</div>
    <div class="big-title">CONTACT</div>

    <div class="text">
        依頼フォームや連絡先を紹介するセクション
    </div>

    <a class="more-btn" href="contact.html">もっと見る</a>
</section>

<script>
    const sections = document.querySelectorAll("section");

    window.addEventListener("scroll", () => {
        sections.forEach(sec => {
            const rect = sec.getBoundingClientRect();

            if (rect.top < window.innerHeight && rect.bottom > 0) {
                sec.querySelector(".section-number").classList.add("show-title");
                sec.querySelector(".big-title").classList.add("show-title");
                sec.querySelector(".text").classList.add("show-text");

                const img = sec.querySelector("img");
                if (img) img.classList.add("show-img");
            }

            if (rect.bottom < 0 || rect.top > window.innerHeight) {
                sec.querySelector(".section-number").classList.remove("show-title");
                sec.querySelector(".big-title").classList.remove("show-title");
                sec.querySelector(".text").classList.remove("show-text");

                const img = sec.querySelector("img");
                if (img) img.classList.remove("show-img");
            }
        });
    });
</script>

</body>
</html>
