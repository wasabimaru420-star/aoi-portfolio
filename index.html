<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Aoi Portfolio - Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background: #0a0a0a;
        color: white;
        font-family: "Noto Sans JP", sans-serif;
        overflow-x: hidden;
    }

    /* 固定ヘッダー */
    header {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 1000;
    }
    nav a {
        color: white;
        margin-left: 10px;
        text-decoration: none;
        font-size: 20px;
        transition: 0.3s;
    }
    nav a:hover {
        color: #000;
        background: #fff;
        padding: 5px 10px;
        border-radius: 4px;
    }

    /* セクション共通 */
    section {
        height: 100vh;
        display: flex;
        align-items: center;
        padding: 100px 80px;
        box-sizing: border-box;
        position: relative;
    }

    section img {
        width: 45%;
        border-radius: 10px;
        opacity: 0;
        transform: translateX(50px);
        transition: 1s ease;
    }

    section .text {
        width: 50%;
        font-size: 32px;
        opacity: 0;
        transform: translateX(-50px);
        transition: 1s ease;
    }

    /* スライドイン後の状態 */
    .show-img {
        opacity: 1;
        transform: translateX(0);
    }
    .show-text {
        opacity: 1;
        transform: translateX(0);
    }

    /* もっと見るボタン */
    .more-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        border: 2px solid white;
        color: white;
        text-decoration: none;
        transition: 0.3s;
    }
    .more-btn:hover {
        background: white;
        color: black;
    }

    /* 最初のメインビジュアル */
    .hero {
        height: 100vh;
        background: url('img/kv2.webp') center/cover no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 48px;
        font-weight: bold;
    }
</style>
</head>

<body>

<header>
    <div>Aoi Portfolio</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="works.html">Works</a>
        <a href="commission.html">Commission</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="hero">
    <!-- メインビジュアル -->
</div>

<!-- 02 ABOUT -->
<section id="about">
    <div class="text">
        02 ABOUT  
        <br>あなたのプロフィールや制作スタイルを紹介するセクション
        <br><a class="more-btn" href="about.html">もっと見る</a>
    </div>
    <img src="img/イラスト196.webp" alt="">
</section>

<!-- 03 WORKS -->
<section id="works">
    <div class="text">
        03 WORKS  
        <br>イラスト作品一覧を紹介するセクション
        <br><a class="more-btn" href="works.html">もっと見る</a>
    </div>
    <img src="img/イラスト14.webp" alt="">
</section>

<!-- 04 COMMISSION -->
<section id="commission">
    <div class="text">
        04 COMMISSION  
        <br>依頼料金や制作の流れを紹介するセクション
        <br><a class="more-btn" href="commission.html">もっと見る</a>
    </div>
    <img src="" alt="">
</section>

<!-- 05 CONTACT -->
</section>

<script>
    /* スクロールでスライドイン */
    const sections = document.querySelectorAll("section");

    window.addEventListener("scroll", () => {
        sections.forEach(sec => {
            const rect = sec.getBoundingClientRect();

            // 画面下の辺がセクション上辺を通過したら発火
            if (rect.top < window.innerHeight && rect.bottom > 0) {
                sec.querySelector(".text").classList.add("show-text");
                sec.querySelector("img").classList.add("show-img");
            }

            // 下から上に戻ったらリセット
            if (rect.bottom < 0 || rect.top > window.innerHeight) {
                sec.querySelector(".text").classList.remove("show-text");
                sec.querySelector("img").classList.remove("show-img");
            }
        });
    });
</script>

</body>
</html>
