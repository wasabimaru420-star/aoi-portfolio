<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Aoi Portfolio - Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding-top: 70px;
        background: #0a0a0a url('img/イラスト25.webp') top center / 100% auto no-repeat;
        color: white;
        font-family: "Noto Sans JP", sans-serif;
        overflow-x: hidden;
    }

    header {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 1000;
        box-sizing: border-box;
    }

    nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        padding: 4px 6px;
        transition: 0.3s;
    }

    nav a:hover {
        color: black;
        background: white;
        border-radius: 4px;
    }

    .hero {
        height: 40vh;
    }

    section {
        min-height: 100vh;
        padding: 900px 80px 60px;
        box-sizing: border-box;
        position: relative;
    }

    /* 白帯 */
    .image-backdrop {
        position: absolute;
        right: 0;
        top: 180px;
        width: 55%;
        height: 45vh;
        background: white;
        border-radius: 20px;
        z-index: -1;
    }

    /* 黄色帯 */
    .big-title-box {
        position: absolute;
        left: 0;
        top: 220px;
        width: 70%;
        height: 180px;
        background: linear-gradient(90deg, #ffe27a, #f5d76e, #eac55f);
        border-radius: 10px;
        z-index: 1;
    }

    .section-number {
        position: absolute;
        left: 20px;
        top: 240px;
        font-size: 60px;
        font-weight: 800;
        color: #444;
        opacity: 0;
        transform: translateY(40px);
        transition: 1s ease;
        z-index: 2;
    }

    .big-title {
        position: absolute;
        left: 20px;
        top: 292px;
        font-size: 120px;
        font-weight: 900;
        color: #444;
        opacity: 0;
        transform: translateY(40px);
        transition: 1s ease;
        line-height: 0.9;
        letter-spacing: -2px;
        z-index: 2;
    }

    /* 白帯右下の説明文＋もっと見るを横並びにするコンテナ */
    .info-box {
        position: absolute;
        right: 40px;
        top: calc(180px + 45vh - 80px); /* 白帯の下端付近 */
        display: flex;
        align-items: center;
        gap: 20px;
        z-index: 4;
    }

    /* 説明文（info-box内で横並び） */
    .text {
        position: static;
        width: auto;
        font-size: 20px;
        color: #444;
        opacity: 1;
        transform: none;
    }

    /* もっと見るボタン（info-box内で横並び） */
    .more-btn {
        position: static;
        background: black;
        color: white;
        padding: 10px 20px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;
    }

    .show-title { opacity: 1; transform: translateY(0); }
    .show-text { opacity: 1; transform: translateY(0); }

    /* イラスト196：下端を白帯下端に完全一致させる */
    .crop-img {
        position: absolute;
        right: 80px;
        width: 55%;
        height: 60vh; /* 膝から上が見える高さ */
        top: calc(180px + 45vh - 60vh); /* 下端が白帯下端と一致する計算式 */
        object-fit: cover;
        object-position: top;
        border-radius: 10px;
        opacity: 0;
        transform: translateX(50px);
        transition: 1s ease;
        z-index: 2;
    }

    /* WORKS の画像（触らない） */
    .normal-img {
        position: absolute;
        right: 80px;
        top: 200px;
        width: 50%;
        height: auto;
        max-height: 38vh;
        object-fit: contain;
        border-radius: 10px;
        opacity: 0;
        transform: translateX(50px);
        transition: 1s ease;
        z-index: 2;
    }

    .show-img { opacity: 1; transform: translateX(0); }
</style>
</head>

<body>

<header>
    <div>Aoi Portfolio</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="works.html">Works</a>
        <a href="commission.html">Commission</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="hero"></div>

<!-- 02 ABOUT -->
<section id="about">
    <div class="image-backdrop"></div>
    <div class="big-title-box"></div>

    <div class="section-number">02</div>
    <div class="big-title">ABOUT</div>

    <img class="crop-img" src="img/イラスト196.webp" alt="">

    <div class="info-box">
        <div class="text">あなたのプロフィールや制作スタイルを紹介するセクション</div>
        <a class="more-btn" href="about.html">もっと見る</a>
    </div>
</section>

<!-- 03 WORKS -->
<section id="works">
    <div class="image-backdrop"></div>
    <div class="big-title-box"></div>

    <div class="section-number">03</div>
    <div class="big-title">WORKS</div>

    <img class="normal-img" src="img/イラスト14.webp" alt="">

    <div class="info-box">
        <div class="text">イラスト作品一覧を紹介するセクション</div>
        <a class="more-btn" href="works.html">もっと見る</a>
    </div>
</section>

<!-- 04 COMMISSION -->
<section id="commission">
    <div class="image-backdrop"></div>
    <div class="big-title-box"></div>

    <div class="section-number">04</div>
    <div class="big-title">COMMISSION</div>

    <div class="info-box">
        <div class="text">依頼料金や制作の流れを紹介するセクション</div>
        <a class="more-btn" href="commission.html">もっと見る</a>
    </div>
</section>

<!-- 05 CONTACT -->
<section id="contact">
    <div class="image-backdrop"></div>
    <div class="big-title-box"></div>

    <div class="section-number">05</div>
    <div class="big-title">CONTACT</div>

    <div class="info-box">
        <div class="text">依頼フォームや連絡先を紹介するセクション</div>
        <a class="more-btn" href="contact.html">もっと見る</a>
    </div>
</section>

<script>
    const sections = document.querySelectorAll("section");

    window.addEventListener("scroll", () => {
        sections.forEach(sec => {
            const rect = sec.getBoundingClientRect();

            if (rect.top < window.innerHeight && rect.bottom > 0) {
                sec.querySelector(".section-number").classList.add("show-title");
                sec.querySelector(".big-title").classList.add("show-title");

                const img = sec.querySelector("img");
                if (img) img.classList.add("show-img");
            }

            if (rect.bottom < 0 || rect.top > window.innerHeight) {
                sec.querySelector(".section-number").classList.remove("show-title");
                sec.querySelector(".big-title").classList.remove("show-title");

                const img = sec.querySelector("img");
                if (img) img.classList.remove("show-img");
            }
        });
    });
</script>

</body>
</html>
