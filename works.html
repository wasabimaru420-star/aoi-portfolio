<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Aoi Portfolio - Works</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background: #0a0a0a;
        color: white;
        font-family: "Noto Sans JP", sans-serif;
        overflow: hidden; /* ★スクロール禁止 */
    }

    /* 上部メニューバー（index.html と同じ） */
    header {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 1000;
        box-sizing: border-box;
    }

    nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        padding: 4px 6px;
        transition: 0.3s;
    }

    nav a:hover {
        color: black;
        background: white;
        border-radius: 4px;
    }

    /* 全体レイアウト（カテゴリバー右側） */
    .works-layout {
        display: grid;
        grid-template-columns: 1fr 220px; /* ← 左が作品、右がカテゴリ */
        grid-template-rows: 1fr 200px;
        height: calc(100vh - 70px);
        margin-top: 70px;
    }

    /* 右側カテゴリバー（スクロールなし） */
    .category-bar {
        grid-column: 2;
        grid-row: 1 / 3;
        background: rgba(255,255,255,0.05);
        padding: 20px;
        overflow-y: hidden; /* ← スクロール禁止 */
        border-left: 1px solid rgba(255,255,255,0.1);
    }

    .category {
        padding: 12px 0;
        cursor: pointer;
        opacity: 0.7;
        font-size: 18px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .category:hover {
        opacity: 1;
    }

    /* 中央の作品表示エリア */
    .work-display {
        padding: 40px;
        display: flex;
        gap: 40px;
        align-items: center;
    }

    #main-work-img {
        width: 40%;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    .work-description {
        width: 50%;
        font-size: 20px;
        line-height: 1.6;
        opacity: 0.9;
    }

    /* 下部カルーセル */
    .work-carousel {
        grid-column: 1 / 3;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding-bottom: 20px;
    }

    .arrow {
        background: rgba(255,255,255,0.1);
        border: none;
        color: white;
        padding: 10px 20px;
        font-size: 20px;
        border-radius: 6px;
        cursor: pointer;
    }

    .arrow:hover {
        background: rgba(255,255,255,0.3);
    }

    .carousel-track {
        display: flex;
        gap: 20px;
        overflow: hidden;
        width: 60%;
    }

    .thumb {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
    }

    .thumb:hover {
        transform: scale(1.1);
    }
</style>
</head>

<body>

<header>
    <div>Aoi Portfolio</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="works.html">Works</a>
        <a href="commission.html">Commission</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="works-layout">

    <!-- 右側カテゴリバー -->
    <aside class="category-bar">
        <div class="category">vtuber</div>
        <div class="category">keyvisual</div>
    </aside>

    <!-- 中央の作品表示エリア -->
    <main class="work-display">
        <img id="main-work-img" src="img/イラスト148.webp">
        <div class="work-description">
            VTuber作品：イラスト148
        </div>
    </main>

    <!-- 下部の作品アイコンカルーセル -->
    <div class="work-carousel">
        <button class="arrow left">←</button>

        <div class="carousel-track"></div>

        <button class="arrow right">→</button>
    </div>

</div>

<script>
/* 作品データ（カテゴリ別） */
const works = {
    vtuber: [
        { src: "img/イラスト148.webp", desc: "VTuber作品：イラスト148" },
        { src: "img/イラスト150.webp", desc: "VTuber作品：イラスト150" },
        { src: "img/イラスト196.webp", desc: "VTuber作品：イラスト196" }
    ],

    keyvisual: [
        { src: "img/kv2.webp", desc: "キービジュアル：kv2" },
        { src: "img/イラスト14.webp", desc: "キービジュアル：イラスト14" }
    ]
};

/* 初期表示は vtuber の1枚目 */
let currentCategory = "vtuber";
let currentIndex = 0;

const mainImg = document.getElementById("main-work-img");
const description = document.querySelector(".work-description");
const track = document.querySelector(".carousel-track");

/* カテゴリを押したら作品一覧を切り替え */
document.querySelectorAll(".category").forEach(cat => {
    cat.addEventListener("click", () => {
        currentCategory = cat.textContent.trim();
        currentIndex = 0;
        updateDisplay();
        updateCarousel();
    });
});

/* 下のアイコンを押したら中央の作品を切り替え */
function updateCarousel() {
    track.innerHTML = "";
    works[currentCategory].forEach((w, i) => {
        const img = document.createElement("img");
        img.src = w.src;
        img.className = "thumb";
        img.addEventListener("click", () => {
            currentIndex = i;
            updateDisplay();
        });
        track.appendChild(img);
    });
}

/* 中央の作品表示を更新 */
function updateDisplay() {
    const w = works[currentCategory][currentIndex];
    mainImg.src = w.src;
    description.textContent = w.desc;
}

/* 初期表示 */
updateDisplay();
updateCarousel();

/* 左右矢印でページ送り */
document.querySelector(".arrow.left").addEventListener("click", () => {
    currentIndex = (currentIndex - 1 + works[currentCategory].length) % works[currentCategory].length;
    updateDisplay();
});

document.querySelector(".arrow.right").addEventListener("click", () => {
    currentIndex = (currentIndex + 1) % works[currentCategory].length;
    updateDisplay();
});
</script>

</body>
</html>
