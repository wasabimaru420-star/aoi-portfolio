<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Aoi Portfolio - Works</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background: #0a0a0a;
        color: white;
        font-family: "Noto Sans JP", sans-serif;
        overflow: hidden;
    }

    /* ★ホームメニューバー（index.html と完全一致） */
    header {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 10px 20px;
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 1000;
    }

    nav {
        display: flex;
        gap: 8px;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        padding: 4px 6px;
        transition: 0.3s;
    }

    nav a:hover {
        color: black;
        background: white;
        border-radius: 4px;
    }

    /* ★ぼかし背景（現在選択中の画像） */
    .blur-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        filter: blur(40px) brightness(0.5);
        z-index: -1;
    }

    .works-layout {
        display: grid;
        grid-template-columns: 1fr 220px;
        grid-template-rows: 1fr 200px;
        height: calc(100vh - 70px);
        margin-top: 70px;
    }

    /* ★カテゴリバー（右側固定） */
    .category-bar {
        grid-column: 2;
        grid-row: 1 / 3;
        background: rgba(255,255,255,0.05);
        padding: 20px;
        overflow-y: hidden;
        border-left: 1px solid rgba(255,255,255,0.1);
    }

    .category {
        padding: 12px 0;
        cursor: pointer;
        opacity: 0.7;
        font-size: 18px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .category:hover {
        opacity: 1;
    }

    /* ★中央の作品表示（説明文の位置を完全固定） */
    .work-display {
        padding: 40px;
        display: grid;
        grid-template-columns: 55% 45%; /* ← 左画像 / 右説明文 を固定 */
        grid-template-rows: 1fr;        /* ← 高さを画像に依存させない */
        align-items: center;
        gap: 40px;
    }

    /* ★画像が見切れないようにする（全身表示） */
    #main-work-img {
        width: 100%;
        height: 100%;        /* ← 高さを固定して説明文がズレない */
        object-fit: contain; /* ← 全身が入る */
        border-radius: 10px;
        box-shadow: 0 0 30px rgba(255,255,255,0.15);
    }

    /* ★説明文の位置を完全固定 */
    .work-description {
        width: 100%;
        height: 100%;        /* ← 画像の高さに影響されない */
        display: flex;
        align-items: flex-start; /* ← 常に上から始まる */
        font-size: 20px;
        line-height: 1.6;
        opacity: 0.9;
    }

    /* ★下の作品シークバー（固定表示） */
    .work-carousel {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding-bottom: 20px;
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(10px);
        z-index: 900;
    }

    .arrow {
        background: rgba(255,255,255,0.1);
        border: none;
        color: white;
        padding: 10px 20px;
        font-size: 20px;
        border-radius: 6px;
        cursor: pointer;
    }

    .arrow:hover {
        background: rgba(255,255,255,0.3);
    }

    .carousel-track {
        display: flex;
        gap: 20px;
        overflow: hidden;
        width: 60%;
    }

    .thumb {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
    }

    .thumb:hover {
        transform: scale(1.1);
    }
</style>
</head>

<body>

<header>
    <div>Aoi Portfolio</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="works.html">Works</a>
        <a href="commission.html">Commission</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<!-- ★ぼかし背景 -->
<div class="blur-bg"></div>

<div class="works-layout">

    <!-- ★カテゴリは全部残す -->
    <aside class="category-bar">
        <div class="category">all</div>
        <div class="category">illustration</div>
        <div class="category">character</div>
        <div class="category">vtuber</div>
        <div class="category">keyvisual</div>
        <div class="category">minicharacter</div>
        <div class="category">other</div>
    </aside>

    <main class="work-display">
        <img id="main-work-img" src="img/イラスト148.webp">
        <div class="work-description">VTuber作品：イラスト148</div>
    </main>

</div>

<!-- ★固定シークバー -->
<div class="work-carousel">
    <button class="arrow left">←</button>
    <div class="carousel-track"></div>
    <button class="arrow right">→</button>
</div>

<script>
/* ★作品データ（カテゴリ別） */
const works = {
    vtuber: [
        { src: "img/イラスト148.webp", desc: "VTuber作品：イラスト148" },
        { src: "img/イラスト150.webp", desc: "VTuber作品：イラスト150" },
        { src: "img/イラスト196.webp", desc: "VTuber作品：イラスト196" }
    ],

    keyvisual: [
        { src: "img/kv2.webp", desc: "キービジュアル：kv2" },
        { src: "img/イラスト14.webp", desc: "キービジュアル：イラスト14" }
    ],

    illustration: [],
    character: [],
    minicharacter: [],
    other: [],
    all: []
};

let currentCategory = "vtuber";
let currentIndex = 0;

const mainImg = document.getElementById("main-work-img");
const description = document.querySelector(".work-description");
const track = document.querySelector(".carousel-track");
const blurBg = document.querySelector(".blur-bg");

/* ★背景を更新する関数 */
function updateBackground(src) {
    blurBg.style.backgroundImage = `url(${src})`;
}

/* カテゴリ切り替え */
document.querySelectorAll(".category").forEach(cat => {
    cat.addEventListener("click", () => {
        currentCategory = cat.textContent.trim();
        currentIndex = 0;

        if (works[currentCategory].length === 0) {
            mainImg.src = "";
            description.textContent = "このカテゴリにはまだ作品がありません。";
            track.innerHTML = "";
            updateBackground("");
            return;
        }

        updateDisplay();
        updateCarousel();
    });
});

/* カルーセル更新 */
function updateCarousel() {
    track.innerHTML = "";
    works[currentCategory].forEach((w, i) => {
        const img = document.createElement("img");
        img.src = w.src;
        img.className = "thumb";
        img.addEventListener("click", () => {
            currentIndex = i;
            updateDisplay();
        });
        track.appendChild(img);
    });
}

/* 中央表示更新 */
function updateDisplay() {
    const w = works[currentCategory][currentIndex];
    mainImg.src = w.src;
    description.textContent = w.desc;

    /* ★背景も更新 */
    updateBackground(w.src);
}

/* 初期表示 */
updateDisplay();
updateCarousel();

/* 左右矢印 */
document.querySelector(".arrow.left").addEventListener("click", () => {
    currentIndex = (currentIndex - 1 + works[currentCategory].length) % works[currentCategory].length;
    updateDisplay();
});

document.querySelector(".arrow.right").addEventListener("click", () => {
    currentIndex = (currentIndex + 1) % works[currentCategory].length;
    updateDisplay();
});
</script>

</body>
</html>
