<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Aoi Portfolio - Works</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background: #0a0a0a;
        color: white;
        font-family: "Noto Sans JP", sans-serif;
        overflow: hidden;
    }

    header {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 10px 20px;
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 1000;
    }

    nav {
        display: flex;
        gap: 8px;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        padding: 4px 6px;
        transition: 0.3s;
    }

    nav a:hover {
        color: black;
        background: white;
        border-radius: 4px;
    }

    .blur-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        filter: blur(40px) brightness(0.5);
        z-index: -1;
    }

    .works-layout {
        display: grid;
        grid-template-columns: 1fr 220px;
        grid-template-rows: 1fr 200px;
        height: calc(100vh - 70px);
        margin-top: 70px;
    }

    .category-bar {
        grid-column: 2;
        grid-row: 1 / 3;
        background: rgba(255,255,255,0.05);
        padding: 20px;
        overflow-y: hidden;
        border-left: 1px solid rgba(255,255,255,0.1);
    }

    .category {
        padding: 12px 0;
        cursor: pointer;
        opacity: 0.7;
        font-size: 18px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .category:hover {
        opacity: 1;
    }

    .work-display {
        padding: 40px;
        display: grid;
        grid-template-columns: 55% 45%;
        align-items: center;
        gap: 40px;
    }

    .img-frame {
        width: 700px;
        height: 900px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
    }

    #main-work-img {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 10px;
    }

    .keyvisual-img {
        object-position: 50% 10%;
    }

    .work-description {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: flex-start;
        font-size: 20px;
        line-height: 1.6;
        opacity: 0.9;
        white-space: pre-line;
    }

    .work-carousel {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding-bottom: 20px;
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(10px);
        z-index: 900;
        transition: 0.4s;
    }

    .work-carousel.hidden {
        transform: translateX(300px);
        opacity: 0;
        pointer-events: none;
    }

    .toggle-carousel {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 40px;
        height: 180px;
        background: rgba(255,255,255,0.2);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 0 8px 8px 0;
        cursor: pointer;
        z-index: 1001;
        transition: 0.3s;
    }

    .show-carousel {
        position: fixed;
        right: 220px;
        bottom: 0;
        width: 40px;
        height: 180px;
        background: rgba(255,255,255,0.2);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px 0 0 8px;
        cursor: pointer;
        z-index: 1001;
        transition: 0.3s;
        display: none;
    }

    .arrow {
        background: rgba(255,255,255,0.1);
        border: none;
        color: white;
        padding: 10px 20px;
        font-size: 20px;
        border-radius: 6px;
        cursor: pointer;
    }

    .arrow:hover {
        background: rgba(255,255,255,0.3);
    }

    .carousel-track {
        display: flex;
        gap: 20px;
        overflow: hidden;
        width: 60%;
    }

    .thumb {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
    }

    .thumb:hover {
        transform: scale(1.1);
    }

    #modal-img {
        pointer-events: none;
    }

    #img-modal {
        overflow: hidden;
    }

    /* ★追加：イラスト150だけサイズを小さくする */
    #main-work-img[src="img/イラスト150.webp"] {
        max-height: 60vh;
    }
</style>
</head>

<body>

<header>
    <div>Aoi Portfolio</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="works.html">Works</a>
        <a href="commission.html">Commission</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="blur-bg"></div>

<div class="works-layout">

    <aside class="category-bar">
        <div class="category">all</div>
        <div class="category">illustration</div>
        <div class="category">character</div>
        <div class="category">vtuber</div>
        <div class="category">keyvisual</div>
        <div class="category">minicharacter</div>
        <div class="category">other</div>
    </aside>

    <main class="work-display">
        <div class="img-frame">
            <img id="main-work-img" src="img/イラスト148.webp">
        </div>
        <div class="work-description">VTuber作品：イラスト148</div>
    </main>

</div>

<div class="work-carousel">
    <div class="toggle-carousel">▶</div>
    <button class="arrow left">←</button>
    <div class="carousel-track"></div>
    <button class="arrow right">→</button>
</div>

<div class="show-carousel">◀</div>

<div id="img-modal" style="
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    backdrop-filter:blur(10px);
    justify-content:center;
    align-items:center;
    z-index:2000;
">
    <img id="modal-img" style="
        max-width:90%;
        max-height:90%;
        border-radius:10px;
    ">

    <button id="modal-close-btn" style="
        position:absolute;
        bottom:20px;
        right:20px;
        padding:10px 20px;
        font-size:18px;
        border:none;
        border-radius:6px;
        background:white;
        color:black;
        cursor:pointer;
    ">戻る</button>
</div>

<script>
window.addEventListener("DOMContentLoaded", () => {

    const works = {
        vtuber: [
            { src: "img/イラスト196.webp", desc: "「葵山葵。」\n自身の代理キャラクターとして生み出した存在であり、個人的な理想と現実を融合させた体。", position: "center top" },   /* ★追加 */
            { src: "img/イラスト148.webp", desc: "「風龍（かざり）」\n十二支をモチーフとしてVtuberを作り出す企画の最初の一人。\n辰×風神がモチーフとなっており、雷蛇とは対となる存在。", position: "center 20%" }, /* ★追加 */
            { src: "img/イラスト150.webp", desc: "「雷蛇（かんだ）」\n十二支をモチーフとしてVtuberを作り出す企画の二人目。\n蛇×雷神がモチーフとなっており、風龍とは対となる存在。", position: "center 30%" } /* ★追加 */
        ],

        keyvisual: [
            { src: "img/kv2.webp", desc: "「葵山葵。キービジュアル」\nイラストレーターという側面と、自身の人格を作った大好きなアニメをイメージして作成したもの。" },
            { src: "img/イラスト14.webp", desc: "「風龍×雷蛇 キービジュアル」\n風龍と雷蛇のモチーフ元となった風神×雷神を合わせたキービジュアル。" }
        ],

        illustration: [],
        character: [],
        minicharacter: [],
        other: [],
        all: []
    };

    const categoryNumber = {
        illustration: 1,
        character: 2,
        vtuber: 3,
        keyvisual: 4,
        minicharacter: 5,
        other: 6
    };

    Object.keys(works).forEach(cat => {
        if (cat === "all") return;
        const num = categoryNumber[cat];
        works[cat].forEach((w, i) => {
            w.code = `${num}-${i+1}`;
            works.all.push({
                src: w.src,
                desc: `${w.desc}（${w.code}）`
            });
        });
    });

    let currentCategory = "vtuber";
    let currentIndex = 0;

    const mainImg = document.getElementById("main-work-img");
    const description = document.querySelector(".work-description");
    const track = document.querySelector(".carousel-track");
    const blurBg = document.querySelector(".blur-bg");

    function updateBackground(src) {
        blurBg.style.backgroundImage = `url(${src})`;
    }

    function updateFrameClass() {
        const frame = document.querySelector(".img-frame");
        frame.className = "img-frame";
    }

    document.querySelectorAll(".category").forEach(cat => {
        cat.addEventListener("click", () => {
            currentCategory = cat.textContent.trim();
            currentIndex = 0;

            if (works[currentCategory].length === 0) {
                mainImg.src = "";
                description.textContent = "このカテゴリにはまだ作品がありません。";
                track.innerHTML = "";
                updateBackground("");
                return;
            }

            updateDisplay();
            updateCarousel();
        });
    });

    function updateCarousel() {
        track.innerHTML = "";
        works[currentCategory].forEach((w, i) => {
            const img = document.createElement("img");
            img.src = w.src;
            img.className = "thumb";
            img.addEventListener("click", () => {
                currentIndex = i;
                updateDisplay();
            });
            track.appendChild(img);
        });
    }

    function updateDisplay() {
        const w = works[currentCategory][currentIndex];
        mainImg.src = w.src;
        description.textContent = w.desc;

        updateBackground(w.src);
        updateFrameClass();

        if (currentCategory === "keyvisual") {
            mainImg.classList.add("keyvisual-img");
        } else {
            mainImg.classList.remove("keyvisual-img");
        }

        /* ★追加：作品ごとの object-position を反映 */
        mainImg.style.objectPosition = w.position || "center";

        mainImg.style.width = "auto";
        mainImg.style.height = "auto";
        mainImg.style.objectFit = "contain";
    }

    updateDisplay();
    updateCarousel();

    document.querySelector(".toggle-carousel").addEventListener("click", () => {
        document.querySelector(".work-carousel").classList.add("hidden");
        document.querySelector(".show-carousel").style.display = "flex";
    });

    document.querySelector(".show-carousel").addEventListener("click", () => {
        document.querySelector(".work-carousel").classList.remove("hidden");
        document.querySelector(".show-carousel").style.display = "none";
    });

    document.querySelector(".arrow.left").addEventListener("click", () => {
        currentIndex = (currentIndex - 1 + works[currentCategory].length) % works[currentCategory].length;
        updateDisplay();
    });

    document.querySelector(".arrow.right").addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % works[currentCategory].length;
        updateDisplay();
    });

    mainImg.addEventListener("click", () => {
        const modal = document.getElementById("img-modal");
        const modalImg = document.getElementById("modal-img");

        modalImg.src = mainImg.src;
        modal.style.display = "flex";
    });

    const modal = document.getElementById("img-modal");
    const modalImg = document.getElementById("modal-img");
    const closeBtn = document.getElementById("modal-close-btn");

    let scale = 1;
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let imgX = 0;
    let imgY = 0;

    modal.addEventListener("wheel", (e) => {
        e.preventDefault();
        scale += e.deltaY * -0.001;
        scale = Math.min(Math.max(0.5, scale), 5);
        modalImg.style.transform = `translate(${imgX}px, ${imgY}px) scale(${scale})`;
    });

    modal.addEventListener("mousedown", (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
    });

    modal.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        imgX += (e.clientX - startX) * 0.5;
        imgY += (e.clientY - startY) * 0.5;
        startX = e.clientX;
        startY = e.clientY;
        modalImg.style.transform = `translate(${imgX}px, ${imgY}px) scale(${scale})`;
    });

    modal.addEventListener("mouseup", () => {
        isDragging = false;
    });

    closeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        modal.style.display = "none";
        scale = 1;
        imgX = 0;
        imgY = 0;
        modalImg.style.transform = "none";
    });
});
</script>

</body>
</html>
