<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Aoi Portfolio - Works</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background: #0a0a0a;
        color: white;
        font-family: "Noto Sans JP", sans-serif;
        overflow: hidden;
    }

    header {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 10px 20px;
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 1000;
    }

    nav {
        display: flex;
        gap: 8px;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        padding: 4px 6px;
        transition: 0.3s;
    }

    nav a:hover {
        color: black;
        background: white;
        border-radius: 4px;
    }

    .blur-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        filter: blur(40px) brightness(0.5);
        z-index: -1;
    }

    .works-layout {
        display: grid;
        grid-template-columns: 1fr 220px;
        grid-template-rows: 1fr 200px;
        height: calc(100vh - 70px);
        margin-top: 70px;
    }

    .category-bar {
        grid-column: 2;
        grid-row: 1 / 3;
        background: rgba(255,255,255,0.05);
        padding: 20px;
        overflow-y: hidden;
        border-left: 1px solid rgba(255,255,255,0.1);
    }

    .category {
        padding: 12px 0;
        cursor: pointer;
        opacity: 0.7;
        font-size: 18px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .category:hover {
        opacity: 1;
    }

    .work-display {
        padding: 40px;
        display: grid;
        grid-template-columns: 55% 45%;
        align-items: center;
        gap: 40px;
    }

    /* ★元の枠に戻す（常に固定） */
    .img-frame {
        width: 700px;
        height: 900px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
    }

    /* ★画像の縮小倍率も元に戻す */
    #main-work-img {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 10px;
    }

    .work-description {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: flex-start;
        font-size: 20px;
        line-height: 1.6;
        opacity: 0.9;
    }

    .work-carousel {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding-bottom: 20px;
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(10px);
        z-index: 900;
        transition: 0.4s;
    }

    .work-carousel.hidden {
        transform: translateX(300px);
        opacity: 0;
        pointer-events: none;
    }

    /* 隠すボタン（左端） */
    .toggle-carousel {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 40px;        /* 横幅はそのまま（必要なら言って） */
        height: 180px;      /* ★ シークバーと同じ高さ */
        background: rgba(255,255,255,0.2);
        color: white;
        display: flex;      /* ★ 中央配置のため追加 */
        align-items: center;/* ★ 縦中央 */
        justify-content: center; /* ★ 横中央 */
        border-radius: 0 8px 8px 0;
        cursor: pointer;
        z-index: 1001;
        transition: 0.3s;
    }

    /* 表示ボタン（右メニューバーに接触） */
    .show-carousel {
        position: fixed;
        right: 220px;       /* メニューバーに接触 */
        bottom: 0;          /* シークバーと同じ位置 */
        width: 40px;        /* 横幅はそのまま */
        height: 180px;      /* ★ シークバーと同じ高さ */
        background: rgba(255,255,255,0.2);
        color: white;
        display: flex;      /* ★ 中央配置 */
        align-items: center;
        justify-content: center;
        border-radius: 8px 0 0 8px;
        cursor: pointer;
        z-index: 1001;
        transition: 0.3s;
        display: none;
    }

    .arrow {
        background: rgba(255,255,255,0.1);
        border: none;
        color: white;
        padding: 10px 20px;
        font-size: 20px;
        border-radius: 6px;
        cursor: pointer;
    }

    .arrow:hover {
        background: rgba(255,255,255,0.3);
    }

    .carousel-track {
        display: flex;
        gap: 20px;
        overflow: hidden;
        width: 60%;
    }

    .thumb {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
    }

    .thumb:hover {
        transform: scale(1.1);
    }
</style>
</head>

<body>

<header>
    <div>Aoi Portfolio</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="works.html">Works</a>
        <a href="commission.html">Commission</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="blur-bg"></div>

<div class="works-layout">

    <aside class="category-bar">
        <div class="category">all</div>
        <div class="category">illustration</div>
        <div class="category">character</div>
        <div class="category">vtuber</div>
        <div class="category">keyvisual</div>
        <div class="category">minicharacter</div>
        <div class="category">other</div>
    </aside>

    <main class="work-display">
        <div class="img-frame">
            <img id="main-work-img" src="img/イラスト148.webp">
        </div>
        <div class="work-description">VTuber作品：イラスト148</div>
    </main>

</div>

<div class="work-carousel">
    <div class="toggle-carousel">▶</div>
    <button class="arrow left">←</button>
    <div class="carousel-track"></div>
    <button class="arrow right">→</button>
</div>

<div class="toggle-carousel">▶</div>
<div class="show-carousel">◀</div>

<script>
const works = {
    vtuber: [
        { src: "img/イラスト148.webp", desc: "VTuber作品：イラスト148" },
        { src: "img/イラスト150.webp", desc: "VTuber作品：イラスト150" },
        { src: "img/イラスト196.webp", desc: "VTuber作品：イラスト196" }
    ],

    keyvisual: [
        { src: "img/kv2.webp", desc: "キービジュアル：kv2" },
        { src: "img/イラスト14.webp", desc: "キービジュアル：イラスト14" }
    ],

    illustration: [],
    character: [],
    minicharacter: [],
    other: [],
    all: []
};

/* カテゴリ番号 */
const categoryNumber = {
    illustration: 1,
    character: 2,
    vtuber: 3,
    keyvisual: 4,
    minicharacter: 5,
    other: 6
};

/* all を自動生成 */
Object.keys(works).forEach(cat => {
    if (cat === "all") return;
    const num = categoryNumber[cat];
    works[cat].forEach((w, i) => {
        w.code = `${num}-${i+1}`;
        works.all.push({
            src: w.src,
            desc: `${w.desc}（${w.code}）`
        });
    });
});

let currentCategory = "vtuber";
let currentIndex = 0;

const mainImg = document.getElementById("main-work-img");
const description = document.querySelector(".work-description");
const track = document.querySelector(".carousel-track");
const blurBg = document.querySelector(".blur-bg");

function updateBackground(src) {
    blurBg.style.backgroundImage = `url(${src})`;
}

/* 枠は常に固定に戻す */
function updateFrameClass() {
    const frame = document.querySelector(".img-frame");
    frame.className = "img-frame";
}

document.querySelectorAll(".category").forEach(cat => {
    cat.addEventListener("click", () => {
        currentCategory = cat.textContent.trim();
        currentIndex = 0;

        if (works[currentCategory].length === 0) {
            mainImg.src = "";
            description.textContent = "このカテゴリにはまだ作品がありません。";
            track.innerHTML = "";
            updateBackground("");
            return;
        }

        updateDisplay();
        updateCarousel();
    });
});

function updateCarousel() {
    track.innerHTML = "";
    works[currentCategory].forEach((w, i) => {
        const img = document.createElement("img");
        img.src = w.src;
        img.className = "thumb";
        img.addEventListener("click", () => {
            currentIndex = i;
            updateDisplay();
        });
        track.appendChild(img);
    });
}

function updateDisplay() {
    const w = works[currentCategory][currentIndex];
    mainImg.src = w.src;
    description.textContent = w.desc;

    updateBackground(w.src);
    updateFrameClass();

    mainImg.style.width = "auto";
    mainImg.style.height = "auto";
    mainImg.style.objectFit = "contain";
}

updateDisplay();
updateCarousel();

/* シークバー隠しボタン */
document.querySelector(".toggle-carousel").addEventListener("click", () => {
    document.querySelector(".work-carousel").classList.add("hidden");
    document.querySelector(".show-carousel").style.display = "block";
});

/* シークバー再表示ボタン */
document.querySelector(".show-carousel").addEventListener("click", () => {
    document.querySelector(".work-carousel").classList.remove("hidden");
    document.querySelector(".show-carousel").style.display = "none";
});

/* 左右ボタン */
document.querySelector(".arrow.left").addEventListener("click", () => {
    currentIndex = (currentIndex - 1 + works[currentCategory].length) % works[currentCategory].length;
    updateDisplay();
});

document.querySelector(".arrow.right").addEventListener("click", () => {
    currentIndex = (currentIndex + 1) % works[currentCategory].length;
    updateDisplay();
});
</script>

</body>
</html>
